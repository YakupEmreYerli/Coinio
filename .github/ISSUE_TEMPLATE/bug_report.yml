name: Bug report
description: Something in Coinio does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check the [troubleshooting page](https://docs.getcoinio.me/docs/reference/troubleshooting) first.
        Security problems go through a private report instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings › ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag or commit, e.g. `latest` pulled on 2026-11-20, or `0.1.0`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Coinio?
      options:
        - Install script
        - docker run
        - Docker Compose
        - Unraid
        - CasaOS
        - Portainer
        - Dokploy
        - From source
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For interface bugs, e.g. Safari on iOS 26, Firefox on Windows.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker logs coinio` around the problem. Remove tokens and addresses you do not want to share.
      render: text
