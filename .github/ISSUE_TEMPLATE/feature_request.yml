name: Feature request
description: Suggest something Coinio should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today. A real example helps more than a solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Screenshots or sketches are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use now
