name: Android release

# A version tag attaches the signed widget APK (coinio-widget-<tag>.apk) to that release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/coinio-widget.jks"
          v="${TAG#v}"; IFS=. read -r major minor patch <<< "${v%%-*}"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/coinio-widget.jks" COINIO_VERSION="$v" COINIO_VERSION_CODE=$((major * 10000 + minor * 100 + patch))
          ./gradlew testDebugUnitTest assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/coinio-widget-$TAG.apk"
      - name: Attach to the release
        run: |
          for i in $(seq 1 30); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 20; done
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" "$RUNNER_TEMP/coinio-widget-$TAG.apk" --clobber
