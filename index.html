<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8fb" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Coinio</title>
    <script>
      // First paint with the last known theme (full settings are applied by the app after load).
      try {
        var a = JSON.parse(localStorage.getItem('coinio.appearance') || 'null');
        if (a) {
          var r = document.documentElement;
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          r.dataset.theme = a.theme === 'system' ? (dark ? 'night' : 'paper') : a.theme;
          r.dataset.stack = a.stack;
          r.dataset.density = a.density;
          r.dataset.logo = a.logoShape;
          if (/^#[0-9a-f]{6}$/i.test(a.accent)) r.style.setProperty('--accent', a.accent);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
