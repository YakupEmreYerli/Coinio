<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8fb" />
    <link rel="icon" type="image/svg+xml" href="/demo/icon.svg" />
    <link rel="apple-touch-icon" href="/demo/apple-touch-icon.png" />
    <title>Coinio</title>
    <script>
      // First paint with the last known theme (full settings are applied by the app after load).
      try {
        var a = JSON.parse(localStorage.getItem('coinio.appearance') || 'null');
        if (a) {
          var r = document.documentElement;
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          r.dataset.theme = a.theme === 'system' ? (dark ? 'night' : 'paper') : a.theme;
          r.dataset.stack = a.stack;
          r.dataset.density = a.density;
          r.dataset.logo = a.logoShape;
          if (/^#[0-9a-f]{6}$/i.test(a.accent)) r.style.setProperty('--accent', a.accent);
        }
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/demo/assets/index-CY0QqCQo.js"></script>
    <link rel="stylesheet" crossorigin href="/demo/assets/index-dJNtzrLJ.css">
  <script>try{var m=/[?&]theme=(dark|light|night|paper)/.exec(location.search);if(m)document.documentElement.dataset.theme=/dark|night/.test(m[1])?'night':'paper'}catch(e){}</script>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
